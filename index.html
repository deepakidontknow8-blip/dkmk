<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Deepak.mk61</title>
<link rel="manifest" href='data:application/manifest+json;charset=utf-8,{"name":"Deepak.mk61","short_name":"DKMK","start_url":"/","display":"standalone","background_color":"%23131314","theme_color":"%231E1F22","orientation":"any","dir":"ltr","scope":"/","description":"Universal Encyclopedia & Offline Survival AI Assistant with Master Security.","icons":[{"src":"https://images.unsplash.com/photo-1534188753412-3e26d0d618d6?w=512","sizes":"512x512","type":"image/jpeg","purpose":"any maskable"}]}'>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;font-family:sans-serif} body{margin:0;background:#131314;color:#E3E3E3;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.hdr{background:#1E1F22;padding:12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #282A2E}
.btn{background:#282A2E;color:#A8C7FA;border:none;padding:8px 12px;border-radius:10px;font-weight:bold;font-size:13px;cursor:pointer}
.bg{background:#81C995;color:#000} .br{background:#B71C1C;color:#fff} .by{background:#FFD740;color:#000}
#mainLayout{display:flex;flex:1;overflow:hidden;position:relative}
#sidebar{width:260px;background:#1E1F22;border-right:1px solid #282A2E;display:flex;flex-direction:column;transition:0.3s;position:absolute;height:100%;z-index:50;left:-260px}
#sidebar.open{left:0}
.shead{padding:12px;border-bottom:1px solid #282A2E;display:flex;justify-content:space-between;align-items:center}
.sbody{flex:1;overflow-y:auto;padding:8px}
.chat-item{padding:10px;border-radius:8px;margin-bottom:6px;cursor:pointer;font-size:13px;background:#282A2E;color:#E3E3E3;display:flex;justify-content:space-between;align-items:center}
.chat-item.active{background:#3c4043;color:#fff;border-left:4px solid #A8C7FA}
#chatArea{flex:1;display:flex;flex-direction:column;height:100%;overflow:hidden}
#chat{flex:1;padding:14px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.card{padding:12px;border-radius:14px;max-width:90%;line-height:1.45;font-size:15px;word-wrap:break-word}
.uc{background:#1E1F22;color:#fff;align-self:flex-end;border:1px solid #333}
.bc{background:#131314;color:#E3E3E3;align-self:flex-start;border:1px solid #282A2E;width:95%}
.ab{display:flex;gap:8px;margin-top:8px;padding-top:6px;border-top:1px solid #1E1F22}
.cimg{max-width:100%;max-height:240px;border-radius:10px;margin:6px 0;display:block}
.btm{display:flex;padding:10px;background:#1E1F22;gap:8px;align-items:center}
input,textarea{background:#282A2E;color:#fff;border:1px solid #3C4043;padding:11px;border-radius:12px;font-size:14px;width:100%;outline:none;margin-bottom:6px}
.mdl{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#131314;z-index:100;flex-direction:column}
.mdl.open{display:flex} .mbody{flex:1;padding:14px;overflow-y:auto}
.scard{background:#1E1F22;padding:12px;border-radius:12px;margin-bottom:10px;border:1px solid #282A2E}
.ptabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:10px;border-bottom:1px solid #282A2E}
#toast{display:none;position:fixed;bottom:75px;left:50%;transform:translateX(-50%);background:#81C995;color:#000;padding:8px 16px;border-radius:20px;font-weight:bold;font-size:13px;z-index:999}
</style>
</head>
<body>
<div id="toast"></div>
<div class="hdr">
<div style="display:flex;gap:8px;align-items:center">
<button class="btn" onclick="toggleSidebar()">☰</button>
<b id="aTitle">🌍 Universal Encyclopedia</b></div>
<div style="display:flex;gap:6px"><button class="btn bg" onclick="newChat()">+ New Chat</button><button class="btn" onclick="openB()">🌐 Encyclopedia Sites</button></div>
</div>
<div id="mainLayout">
<div id="sidebar">
<div class="shead"><b style="color:#A8C7FA">💬 Chats</b><button class="btn br" onclick="toggleSidebar()">✕</button></div>
<div id="chatList" class="sbody"></div>
<div style="padding:10px;background:#131314;display:flex;gap:6px">
<button class="btn by" style="flex:1" onclick="openM()">⚙️ Menu</button>
</div>
</div>
<div id="chatArea">
<div id="chat"></div>
<div class="btm">
<label class="btn" style="margin:0">📷<input type="file" accept="image/*" style="display:none" onchange="chatImg(event)"></label>
<input id="cInp" placeholder="ब्रह्मांड, पेड़-पौधे, जीव, कीड़े या रेसिपी खोजें..." style="margin:0" onkeydown="if(event.key==='Enter')sendM()">
<button class="btn" style="background:#A8C7FA;color:#000;padding:11px 16px" onclick="sendM()">➤</button>
</div>
</div>
</div>
<div id="mMdl" class="mdl"><div class="hdr"><b style="color:#A8C7FA">⚙️ Master Settings</b><button class="btn br" onclick="closeM()">✕</button></div>
<div style="display:flex;gap:4px;padding:8px;background:#1E1F22;overflow-x:auto"><button class="btn bg" onclick="closeM();openB()">🌐 Encyclopedia</button><button class="btn" onclick="mTab(2)">📍 Maps</button><button class="btn by" onclick="mTab(4)">👤 Profile</button></div><div id="mBox" class="mbody"></div></div>
<div id="bMdl" class="mdl"><div class="hdr"><span id="vBdg" style="font-size:12px;color:#81C995;font-weight:bold">👤 User</span><div style="display:flex;gap:6px"><button class="btn by" id="admB" onclick="tglAdm()">🔑 Master Login</button><button class="btn br" onclick="closeB()">✕</button></div></div>
<div id="pBox" style="display:none;background:#252830;padding:10px"><div style="font-size:12px;color:#FFD740;margin-bottom:4px">Enter Master Security PIN:</div><div style="display:flex;gap:6px"><input type="password" id="pInp" placeholder="Enter PIN" style="margin:0"><button class="btn by" onclick="chkP()">Login</button><button class="btn br" onclick="hideP()">✕</button></div></div>
<div style="padding:10px;background:#1E1F22"><div id="sCnt" style="font-size:13px;font-weight:bold;color:#A8C7FA;margin-bottom:6px">📚 Cloud Encyclopedia Database</div><div style="display:flex;gap:6px"><input id="wInp" placeholder="विषय खोजें..." oninput="rSites()" style="margin:0"><button class="btn bg" onclick="openF(-1)">➕ Add Topic</button></div></div><div id="sArea" class="mbody"></div></div>
<div id="fMdl" class="mdl"><div class="hdr"><b style="color:#81C995">➕ Encyclopedia Editor</b><button class="btn br" onclick="closeF()">✕</button></div><div class="mbody"><div id="sFlds"><label style="font-size:12px;color:#A8C7FA">Category Name:</label><input id="fSN" placeholder="ब्रह्मांड / पेड़-पौधे"><label style="font-size:12px;color:#A8C7FA">Main Title:</label><input id="fST" placeholder="शीर्षक"></div><label style="font-size:12px;color:#81C995">Section Title:</label><input id="fPT" placeholder="उप-शीर्षक"><label style="font-size:12px">Detailed Content:</label><textarea id="fPB" rows="7" placeholder="यहाँ पूरी जानकारी लिखें..."></textarea><button class="btn bg" style="width:100%;padding:12px" onclick="saveF()">💾 Save Info</button></div></div>
<div id="vMdl" class="mdl"><div class="hdr"><span id="vUrl" style="color:#81C995;font-size:12px;font-weight:bold"></span><button class="btn br" onclick="closeV()">✕ Back</button></div><div class="mbody"><h2 id="vTit" style="color:#A8C7FA;margin:4px 0"></h2><div id="pBar" class="ptabs"></div><img id="vImg" class="cimg" style="display:none"><div id="vBdy" style="background:#1E1F22;padding:12px;border-radius:12px;white-space:pre-wrap;line-height:1.6"></div></div></div>
<script>
const MASTER_PIN="8851334022Dk";
const SUPABASE_URL="https://rsuubnqbicwaqecqvwcg.supabase.co";
const SUPABASE_KEY="sb_publishable_eeMJzkDFl2NuiAF0onshUw_L815KxMS";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let mem={};
function sG(k,d){try{return localStorage.getItem(k)||d}catch(e){return mem[k]||d}}
function sS(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}}
let cfg=JSON.parse(sG("ai_cfg",'{"user_id":"u_'+Math.floor(Math.random()*10000)+'","user_name":"Deepak.mk61","is_master":false,"auto_speak":true}'));
let brain=Object.assign({
    "hello": "नमस्ते बॉस! यूनिवर्सल एनसाइक्लोपीडिया में आपका स्वागत है।",
    "universe": "ब्रह्मांड अरबों आकाशगंगाओं, तारों और ग्रहों से मिलकर बना है।",
    "recipe": "आपातकालीन और सात्विक भोजन के लिए मूंग दाल की खिचड़ी सबसे उत्तम है।"
},JSON.parse(sG("ai_brain","{}")));

let sites = [];

async function loadCloudSites(){
  let { data, error } = await supabaseClient.from('encyclopedia').select('*');
  if(!error && data && data.length > 0){
    sites = data.map(d => d.content);
  } else {
    sites = [
      {
        "id": "site_univ",
        "site_name": "🌌 ब्रह्मांड और अंतरिक्ष",
        "title": "ब्रह्मांड, आकाशगंगा और ब्लैक होल",
        "content": "ब्रह्मांड में अनगिनत आकाशगंगाएँ (Galaxies), तारे, ग्रह, और ब्लैक होल मौजूद हैं।",
        "parts": [
          {
            "part_title": "1. मिल्की वे और ब्लैक होल",
            "part_content": "हमारी पृथ्वी 'मिल्की वे' (Milky Way) गैलेक्सी का हिस्सा है। ब्लैक होल अंतरिक्ष का वह क्षेत्र है जहाँ गुरुत्वाकर्षण इतना अधिक होता है कि प्रकाश भी बाहर नहीं आ सकता।",
            "part_image": "https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?w=600"
          }
        ],
        "author_id": "MASTER_ADMIN",
        "author_name": "👑 Master Owner",
        "time": "आधिकारिक डेटा"
      }
    ];
  }
  rSites();
}

let threads=JSON.parse(sG("ai_threads", "[]"));
let currThreadId=sG("ai_curr_thread","");
let aud=null, eMod={si:-1};
function tst(m){let t=document.getElementById("toast");t.innerText=m;t.style.display="block";setTimeout(()=>t.style.display="none",2200)}
function sv(){sS("ai_cfg",JSON.stringify(cfg));sS("ai_brain",JSON.stringify(brain));sS("ai_threads",JSON.stringify(threads));sS("ai_curr_thread",currThreadId)}
function spk(t){stp();try{let a=new Audio("https://translate.googleapis.com/translate_tts?ie=UTF-8&q="+encodeURIComponent(t.slice(0,180))+"&tl=hi&client=tw-ob");aud=a;a.play().catch(e=>{})}catch(e){}}
function stp(){if(aud){try{aud.pause();aud.currentTime=0}catch(e){}}}
function toggleSidebar(){document.getElementById("sidebar").classList.toggle("open");renderThreads()}
function newChat(){let id="th_"+Date.now();threads.unshift({id:id,title:"New Chat",pinned:false,msgs:[]});currThreadId=id;sv();renderThreads();loadCurrChat();toggleSidebar()}
function renderThreads(){
  let list=document.getElementById("chatList");list.innerHTML="";
  threads.sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0));
  if(threads.length===0){newChat();return}
  if(!currThreadId)currThreadId=threads[0].id;
  threads.forEach(th=>{
    let d=document.createElement("div");d.className="chat-item "+(th.id===currThreadId?"active":"");
    d.innerHTML='<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" onclick="switchThread(\''+th.id+'\')">'+(th.pinned?"📌 ":"💬 ")+th.title+'</span><div style="display:flex;gap:4px"><button class="btn" style="padding:2px 6px;font-size:10px" onclick="pinTh(event,\''+th.id+'\')">📌</button><button class="btn br" style="padding:2px 6px;font-size:10px" onclick="delTh(event,\''+th.id+'\')">🗑️</button></div>';
    list.appendChild(d);
  })
}
function switchThread(id){currThreadId=id;sv();renderThreads();loadCurrChat();toggleSidebar()}
function pinTh(e,id){e.stopPropagation();let th=threads.find(x=>x.id===id);if(th)th.pinned=!th.pinned;sv();renderThreads()}
function delTh(e,id){e.stopPropagation();threads=threads.filter(x=>x.id!==id);sv();renderThreads();loadCurrChat()}
function loadCurrChat(){
  let chat=document.getElementById("chat");chat.innerHTML="";
  let th=threads.find(x=>x.id===currThreadId);
  if(!th){newChat();return}
  th.msgs.forEach(m=>{
    if(m.sender==="user")usrC(m.txt,m.img,false);
    else botC(m.txt,m.img,false);
  });
  chat.scrollTop=chat.scrollHeight;
}
function appendMsg(sender,txt,img){
  let th=threads.find(x=>x.id===currThreadId);
  if(!th){newChat();th=threads.find(x=>x.id===currThreadId)}
  if(th.title==="New Chat"&&sender==="user"){th.title=txt.slice(0,25)+(txt.length>25?"...":"")}
  th.msgs.push({sender:sender,txt:txt,img:img});sv();renderThreads();
}
function botC(t,im="",save=true){
  let chat=document.getElementById("chat"),d=document.createElement("div");
  d.className="card bc";let sf=t.replace(/'/g,"").replace(/"/g,"").replace(/\n/g," ");
  let ih=im?'<img src="'+im+'" class="cimg">':"";
  d.innerHTML='<div style="color:#A8C7FA;font-size:12px;font-weight:bold">✦ Universal Encyclopedia</div>'+ih+'<div style="white-space:pre-wrap">'+t+'</div><div class="ab"><button class="btn" onclick="spk(\''+sf+'\')">🔊 Listen</button><button class="btn" onclick="stp()">⏹️ Stop</button></div>';
  chat.appendChild(d);chat.scrollTop=chat.scrollHeight;
  if(save)appendMsg("bot",t,im);
}
function usrC(t,im="",save=true){
  let chat=document.getElementById("chat"),d=document.createElement("div");
  d.className="card uc";d.innerHTML=(im?'<img src="'+im+'" class="cimg">':"")+"<div>"+t+"</div>";
  chat.appendChild(d);chat.scrollTop=chat.scrollHeight;
  if(save)appendMsg("user",t,im);
}
function chatImg(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=x=>{usrC("📎 "+f.name,x.target.result);botC("Photo received!")};r.readAsDataURL(f)}
function sendM(){
  let i=document.getElementById("cInp"),t=i.value.trim();if(!t)return;
  usrC(t);i.value="";let q=t.toLowerCase();
  for(let s of sites){
    for(let p of (s.parts||[])){
      if(p.part_title.toLowerCase().includes(q) || p.part_content.toLowerCase().includes(q) || s.title.toLowerCase().includes(q) || s.site_name.toLowerCase().includes(q)){
        botC("📚 ["+s.site_name+"] - "+p.part_title+":\n\n"+p.part_content, p.part_image || "");
        return;
      }
    }
  }
  for(let k in brain){if(q.includes(k)||k.includes(q)){botC(brain[k]);return}}
  botC("यह जानकारी आपके एनसाइक्लोपीडिया डेटाबेस में खोज ली गई है।");
}
function openM(){document.getElementById("mMdl").classList.add("open");mTab(4)} function closeM(){document.getElementById("mMdl").classList.remove("open")}
function mTab(n){let b=document.getElementById("mBox");
if(n===4){b.innerHTML='<h3>👤 User Profile</h3><div class="scard"><b>Your Name:</b><br><br><input id="uNI" value="'+cfg.user_name+'"><button class="btn bg" onclick="cfg.user_name=document.getElementById(\'uNI\').value;sv();tst(\'Name Saved!\')">💾 Save Name</button></div>'}
else if(n===2){b.innerHTML='<h3>📍 Maps</h3><div class="scard"><button class="btn bg" style="width:100%" onclick="window.location.href=\'https://www.google.com/maps\'">🗺️ Open Google Maps</button></div>'}}
function openB(){document.getElementById("bMdl").classList.add("open");rSites()} function closeB(){document.getElementById("bMdl").classList.remove("open")}
function canEdit(s){return cfg.is_master||s.author_id===cfg.user_id}
function tglAdm(){if(cfg.is_master){cfg.is_master=false;sv();rSites();tst("Master Logged Out");document.getElementById("admB").innerText="🔑 Master Login"}else{document.getElementById("pBox").style.display="block"}}
function hideP(){document.getElementById("pBox").style.display="none"}
async function chkP(){
  if(document.getElementById("pInp").value.trim()===MASTER_PIN){
    cfg.is_master=true;sv();hideP();document.getElementById("pInp").value="";rSites();
    tst("👑 Master Owner Mode Active!");
    document.getElementById("admB").innerText="🔓 Master Active";
  } else {
    tst("❌ Wrong Master PIN!");
  }
}
function rSites(){
  let q=document.getElementById("wInp").value.toLowerCase().trim(),a=document.getElementById("sArea");a.innerHTML="";
  sites.forEach((s,i)=>{
    let txt=(s.site_name+" "+s.title+" "+JSON.stringify(s.parts)).toLowerCase();if(q&&!txt.includes(q))return;
    let c=document.createElement("div");c.className="scard";
    let editable=canEdit(s);
    let mb=editable?'<button class="btn by" onclick="openF('+i+')">✏️ Edit</button> <button class="btn br" onclick="delSite(\''+s.id+'\', '+i+')">🗑️ Delete</button>':'<small style="color:#888">🔒 Master Locked</small>';
    c.innerHTML='<div style="display:flex;justify-content:space-between;font-size:12px;color:#81C995"><b>'+s.site_name+'</b><span>✍️ '+s.author_name+'</span></div><h3 style="color:#A8C7FA;margin:6px 0" onclick="viewS('+i+',0)">'+s.title+'</h3><div style="display:flex;gap:6px;align-items:center"><button class="btn" onclick="viewS('+i+',0)">📖 Read Info</button> '+mb+'</div>';
    a.appendChild(c);
  })
}
function closeF(){document.getElementById("fMdl").classList.remove("open")}
function openF(si){eMod.si=si;let s=si>=0?sites[si]:null;document.getElementById("fSN").value=s?s.site_name:"";document.getElementById("fST").value=s?s.title:"";document.getElementById("fPT").value=s?s.parts[0].part_title:"Part 1";document.getElementById("fPB").value=s?s.parts[0].part_content:"";document.getElementById("fMdl").classList.add("open")}

async function saveF(){
  let pt=document.getElementById("fPT").value.trim()||"Part 1",pb=document.getElementById("fPB").value.trim();if(!pb)return tst("Write content!");
  let sn=document.getElementById("fSN").value.trim(),st=document.getElementById("fST").value.trim();if(!sn||!st)return tst("Fill Name & Title!");
  
  if(eMod.si>=0){
    let s=sites[eMod.si];
    if(!cfg.is_master && s.author_id==="MASTER_ADMIN")return tst("❌ Master content is locked!");
    s.site_name=sn;s.title=st;s.parts[0].part_title=pt;s.parts[0].part_content=pb;
    await supabaseClient.from('encyclopedia').upsert({ id: s.id, content: s });
  }else{
    let newId = "s_" + Date.now();
    let newObj = {
      id: newId,
      site_name: sn,
      title: st,
      author_id: cfg.is_master ? "MASTER_ADMIN" : cfg.user_id,
      author_name: cfg.is_master ? "👑 Master Owner" : cfg.user_name,
      parts: [{part_title: pt, part_content: pb, part_image: ""}]
    };
    sites.unshift(newObj);
    await supabaseClient.from('encyclopedia').upsert({ id: newId, content: newObj });
  }
  closeF();rSites();tst("✅ Saved to Cloud Successfully!");
}

async function delSite(id, i){
  if(!cfg.is_master && sites[i].author_id === "MASTER_ADMIN") {
    tst("❌ Cannot delete Master content!");
    return;
  }
  await supabaseClient.from('encyclopedia').delete().eq('id', id);
  sites.splice(i, 1);
  rSites();
  tst("🗑️ Deleted from Cloud!");
}

function closeV(){document.getElementById("vMdl").classList.remove("open")}
function viewS(si,pi){
  let s=sites[si],p=s.parts[pi]||s.parts[0];
  document.getElementById("vMdl").classList.add("open");
  document.getElementById("vTit").innerText=s.title;
  let imgEl=document.getElementById("vImg");
  if(p.part_image){imgEl.src=p.part_image;imgEl.style.display="block"}else{imgEl.style.display="none"}
  let tb=document.getElementById("pBar");tb.innerHTML="";
  s.parts.forEach((pt,i)=>{let b=document.createElement("button");b.className="btn "+(i===pi?"bg":"");b.innerText=pt.part_title;b.onclick=()=>viewS(si,i);tb.appendChild(b)});
  document.getElementById("vBdy").innerText=p.part_content;
}

window.onload=()=>{ 
  if(threads.length===0)newChat();else loadCurrChat(); 
  loadCloudSites(); 
}; 
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js")
      .catch(err => console.error("Service Worker registration failed:", err));
  });
}
</script>

</body>
</html>
